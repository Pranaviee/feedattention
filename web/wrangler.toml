# Cloudflare Workers — static assets + /api proxy to the Python inspector.
#
# Deploy with `npx wrangler deploy` (after `npm run build`).
# `name` MUST match the Worker name in the Cloudflare dashboard.
name = "dataforgeweb"
main = "worker.js"
compatibility_date = "2026-09-08"

[vars]
API_ORIGIN = "https://sudaynandan.onrender.com"

[assets]
directory = "./dist"
binding = "ASSETS"
# /api/* must hit the Worker, not the SPA fallback.
run_worker_first = ["/api/*"]
# Serve index.html for unknown paths. The explainer navigates by hash
# anchors rather than routes, so this is belt-and-braces.
# /livemodel/* is real static HTML copied into dist by the Vite plugin —
# those files must exist, or SPA fallback nests the explainer in its own iframe.
not_found_handling = "single-page-application"
